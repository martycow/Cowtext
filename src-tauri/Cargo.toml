[package]
name = "cowtext"
version = "0.1.0"
description = "A tool to maintain and visualize context files."
authors = ["you"]
edition = "2021"
default-run = "cowtext"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cowtext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# WO03 Lane C: headless CI binary. Never constructs `tauri::Builder`; calls
# only the plain, non-Tauri-context functions `cowtext_lib` exposes
# (`project::{read_graph,migrate_graph,serialize_graph}`,
# `compile::compile_preview`, `lint::lint_graph`).
[[bin]]
name = "cowtext-cli"
path = "src/bin/cowtext_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
notify = "8"

